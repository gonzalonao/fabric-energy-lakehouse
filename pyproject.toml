[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy_lakehouse"
version = "0.4.0"
description = "Typed REE parsers and data-quality checks for the Fabric energy lakehouse."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gonzalo López Crespo" }]
# No runtime dependencies: pyspark is provided by the Fabric Spark runtime, not vendored
# into the wheel. Parsers and DQ checks are pure Python and Spark-free by design.
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]
# Deploy tooling is not a runtime dependency of the wheel — it never runs inside Fabric.
# Pinned: a deploy tool whose behaviour drifts between runs isn't a deploy tool.
deploy = ["fabric-cicd==1.2.0", "azure-identity>=1.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/energy_lakehouse"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]
# Fabric notebooks serialize with mid-file imports and a runtime-injected `spark`; they
# are not plain modules and are linted in their own right, not here.
extend-exclude = ["fabric"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't need module/function docstrings.
"tests/*" = ["D100", "D103", "D104"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

# fabric-cicd ships no py.typed marker. Scoped to that one module rather than relaxing
# strictness anywhere else; harmless no-op if the package later ships type information.
[[tool.mypy.overrides]]
module = ["fabric_cicd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
